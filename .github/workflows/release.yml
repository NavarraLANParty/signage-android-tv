name: release.yml

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  generate-android-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get release tag
        id: get_release_tag
        run: echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install node dependencies
        run: npm ci

      - name: Generate Android project
        run: npx -y expo prebuild

      - name: Set gradle permissions
        run: chmod +x android/gradlew

      - name: Build Android project
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            "android/app/build/outputs/apk/release/nlp-sign-android-${{ github.event.release.tag_name }}.apk"

      - name: Attach APK to release
        uses: softprops/action-gh-release@v3
        with:
          files: android/app/build/outputs/apk/release/nlp-sign-android-${{ github.event.release.tag_name }}.apk
